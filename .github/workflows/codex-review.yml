name: requested-codex-review

on:
  pull_request_target:
    types: [review_requested, labeled, ready_for_review]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    if: >-
      (github.event_name == 'pull_request_target' &&
        ((github.event.action == 'review_requested' && github.event.requested_reviewer.login == 'SoroushRF') ||
         (github.event.action == 'labeled' && github.event.label.name == 'ai-review-ready') ||
         github.event.action == 'ready_for_review')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.id == 98989697 && github.event.comment.body == '/codex-review-now') ||
      github.event_name == 'workflow_run' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.actor_id == '98989697')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize the repository budget after filtering unrelated/comment-generated events.
    concurrency:
      group: codex-review-admission
      cancel-in-progress: false
    steps:
      # Always load trusted default-branch automation, including on fork PRs/comments.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Install pinned validation library (no lifecycle scripts or PR dependencies)
        run: npm install --prefix scripts/ci --no-save --package-lock=false --ignore-scripts --no-audit --no-fund zod@4.6.7
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8, Node 24
        env:
          REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_GITHUB_TOKEN }}
        with:
          # The ledger reconciles unknown comment outcomes; never blindly retry a post.
          retries: 0
          script: |
            if (!process.env.REVIEW_TOKEN) throw new Error('Missing CODEX_REVIEW_GITHUB_TOKEN');
            const account = new github.constructor({
              auth: process.env.REVIEW_TOKEN,
              retry: { enabled: false },
              request: { retries: 0, timeout: 30000 }
            });
            const { dispatch } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/codex-review.ts`);
            const results = await dispatch(github, account, context);
            await core.summary.addHeading('Codex admission — not a review approval')
              .addList(results).write();
